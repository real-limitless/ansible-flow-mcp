<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ansible-flow hub console</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">ansible<span>-flow</span></div></div>
      <div class="auth-row">
        <span id="who" class="muted"></span>
        <button id="logout" class="pill-btn" type="button">Sign out</button>
      </div>
    </header>
    <p class="eyebrow">Operator console · localhost hub</p>
    <h1 class="display">Servers, groups,<br /><em>invite once.</em></h1>
    <div class="nav-bar">
      <nav class="seg">
        <button type="button" class="seg-btn active" data-tab="servers">Servers</button>
        <button type="button" class="seg-btn" data-tab="groups">Groups</button>
        <button type="button" class="seg-btn" data-tab="hub">Hub</button>
        <button type="button" class="seg-btn" data-tab="operators">Operators</button>
      </nav>
    </div>
    <p id="err" class="err" hidden></p>
    <main>
      <section id="tab-servers" class="panel active"></section>
      <section id="tab-groups" class="panel"></section>
      <section id="tab-hub" class="panel"></section>
      <section id="tab-operators" class="panel"></section>
    </main>
  </div>
  <script src="/static/console.js"></script>
</body>
</html>
