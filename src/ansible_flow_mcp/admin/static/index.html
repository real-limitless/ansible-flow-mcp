<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ansible-flow-mcp admin</title>
  <meta name="description" content="Hub operator console for ansible-flow-mcp." />
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">ansible<span>-flow</span></div>
      </div>
      <div class="meta-pills">
        <span class="pill accent">Admin</span>
        <span class="pill vault">Hub</span>
        <span class="pill on">Local</span>
      </div>
    </header>

    <section class="hero-admin">
      <p class="eyebrow">Operator console · hub inventory</p>
      <h1 class="display">Fleet control.<br /><em>Agents stay on stdio.</em></h1>
      <p class="lede">
        Enroll spokes, register Ansible targets, group hosts, and read the hub audit —
        same membership APIs as the TUI and hub MCP session.
      </p>
    </section>

    <div class="nav-bar">
      <nav class="seg tabs" aria-label="Admin sections">
        <button type="button" data-tab="status" class="seg-btn active">Status</button>
        <button type="button" data-tab="servers" class="seg-btn">Servers</button>
        <button type="button" data-tab="targets" class="seg-btn">Targets</button>
        <button type="button" data-tab="groups" class="seg-btn">Groups</button>
        <button type="button" data-tab="audit" class="seg-btn">Audit</button>
      </nav>
      <div class="auth-row">
        <input id="token" type="password" placeholder="Admin token" autocomplete="off" />
        <button id="saveToken" type="button" class="pill-btn primary">Save</button>
        <button id="refresh" type="button" class="pill-btn ghost">Refresh</button>
      </div>
    </div>

    <main class="panel-stack">
      <section id="tab-status" class="panel active"></section>
      <section id="tab-servers" class="panel"></section>
      <section id="tab-targets" class="panel"></section>
      <section id="tab-groups" class="panel"></section>
      <section id="tab-audit" class="panel"></section>
    </main>
  </div>
  <p id="err" class="err" hidden></p>
  <script src="/admin/app.js"></script>
</body>
</html>
