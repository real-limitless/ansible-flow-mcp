Port 22
Protocol 2
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
UsePAM no
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
PrintMotd no
AllowUsers mcp-spoke
# ForceCommand also on authorized_keys from join
Match User mcp-spoke
    ForceCommand /usr/local/bin/ansible-flow-mcp spoke session
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
