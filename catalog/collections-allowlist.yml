# Collections permitted for search/schema/run (v1).
# Extend deliberately — dual-tracked with OpenFlow Ansible gallery.
collections:
  - ansible.builtin
  - community.general
  - ansible.posix
  - community.docker
  - amazon.aws
  - ansible.utils
  - ansible.windows
  - ansible.netcommon
  - community.crypto
  - community.windows
  - kubernetes.core
  - community.aws
  - awx.awx
  - community.postgresql
  - community.vmware
  - community.hashi_vault
  - azure.azcollection
  - community.zabbix
  - containers.podman
  - netbox.netbox
  - google.cloud
  - chocolatey.chocolatey
  - cisco.ios
  - openstack.cloud
  - servicenow.servicenow
  - vmware.vmware
  - oracle.oci
  - microsoft.ad
  - cisco.nxos
  - cloud.common
  - community.mongodb
  - theforeman.foreman
  - community.grafana
  - operator_sdk.util
  - infra.ah_configuration
  - arista.eos
  - community.rabbitmq

# Modules denied even if collection is allowed (free-form / high risk).
deny_modules:
  - ansible.builtin.shell
  - ansible.builtin.command
  - ansible.builtin.raw
  - ansible.builtin.script

# Pattern for FQCN validation
fqcn_pattern: '^[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+$'
