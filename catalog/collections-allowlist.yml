# Modules denied even if collection is allowed (free-form / high risk).
deny_modules:
  - ansible.builtin.shell
  - ansible.builtin.command
  - ansible.builtin.raw
  - ansible.builtin.script

# Pattern for FQCN validation
fqcn_pattern: '^[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+$'
