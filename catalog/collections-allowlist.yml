# Collections permitted for search/schema/run (v1).
# Extend deliberately — dual-tracked with OpenFlow Ansible gallery.
collections:
  - ansible.builtin
  - community.general
  - ansible.posix
  - community.docker

# Modules denied even if collection is allowed (free-form / high risk).
deny_modules:
  - ansible.builtin.shell
  - ansible.builtin.command
  - ansible.builtin.raw
  - ansible.builtin.script

# Pattern for FQCN validation
fqcn_pattern: '^[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+\.[a-zA-Z0-9_]+$'
