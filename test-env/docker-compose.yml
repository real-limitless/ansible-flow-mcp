      - afm-test-home-fedora-mesh:/home/mcp-spoke
      - afm-test-home-fedora-ansible:/home/mcp-ansible
      - afm-test-join-key:/run/join-key:ro
      - afm-test-join-fedora:/run/join-drop:ro
    environment:
