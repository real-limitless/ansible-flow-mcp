# Family default: single-node hub on 8789. Multi-spoke fabric: lab/
name: ansible-flow-mcp

services:
  ansible-flow-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ansible-flow-mcp:local
    container_name: ansible-flow-mcp
    expose:
      - "8789"
    environment:
      ANSIBLE_FLOW_ROLE: hub
      ANSIBLE_FLOW_HUB_DIR: /var/lib/ansible-flow/hub
      ANSIBLE_FLOW_HUB_NAME: ${ANSIBLE_FLOW_HUB_NAME:-hub-01}
      ANSIBLE_FLOW_HTTP_PORT: "8789"
    volumes:
      - ansible-flow-hub:/var/lib/ansible-flow/hub
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  ansible-flow-hub:
