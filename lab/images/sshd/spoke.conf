Port 22
Protocol 2
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
# UsePAM and GSSAPIAuthentication are omitted. Alpine's sshd rejects both
# and logs that on every connection. Upstream defaults are already no.
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
PrintMotd no
# mcp-spoke = mesh ForceCommand MCP; mcp-ansible = real shell for ansible CLI
AllowUsers mcp-spoke mcp-ansible
Match User mcp-spoke
    ForceCommand /usr/local/bin/ansible-flow-mcp spoke session
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
Match User mcp-ansible
    PermitTTY yes
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PasswordAuthentication no
    AuthenticationMethods publickey
