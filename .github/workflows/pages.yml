name: pages

on:
  push:
    branches: [CORE]
    paths:
      - "site/**"
      - "catalog/**"
      - ".github/workflows/pages.yml"
      - "scripts/generate_browse.py"
      - "scripts/site_preview.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site artifact
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp -a site/. _site/
          if [[ -f scripts/generate_browse.py ]]; then
            python3 scripts/generate_browse.py
            cp -a catalog/browse _site/catalog/browse 2>/dev/null || true
          fi
          if [[ -f catalog/gallery.json ]]; then
            cp -a catalog/gallery.json _site/catalog/gallery.json
          fi
          if [[ -d catalog/schemas ]]; then
            cp -a catalog/schemas _site/catalog/schemas
          fi
          REPO="${GITHUB_REPOSITORY##*/}"
          BASE="/${REPO}/"
          find _site -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -i "s|data-base=\"\"|data-base=\"${BASE}\"|g" "$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
