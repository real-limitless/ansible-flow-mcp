name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/gallery.json"
      - "catalog/schemas/**"
      - ".github/workflows/pages.yml"
      - "scripts/site_preview.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site artifact
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp -a site/. _site/
          cp -a catalog/gallery.json _site/catalog/gallery.json
          cp -a catalog/schemas _site/catalog/schemas
          # Project Pages base path for absolute nav if ever needed
          REPO="${GITHUB_REPOSITORY##*/}"
          BASE="/${REPO}/"
          find _site -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -i "s|data-base=\"\"|data-base=\"${BASE}\"|g" "$f"
          done
          # Relative asset URLs stay valid; chrome.js prefixes in-page links with data-base
          echo "Built _site with base ${BASE}"
          du -sh _site _site/catalog/gallery.json _site/catalog/schemas | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
