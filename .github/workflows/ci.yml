name: ci
on:
  push:
    branches: [main, DEVELOPMENT]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Build admin UI
        working-directory: admin-ui
        run: npm ci && npm run build
      - name: Committed admin static matches the UI build
        run: |
          if [ -n "$(git status --porcelain -- src/ansible_flow_mcp/admin/static)" ]; then
            git status --porcelain -- src/ansible_flow_mcp/admin/static
            git diff --stat -- src/ansible_flow_mcp/admin/static
            exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: pytest -q
