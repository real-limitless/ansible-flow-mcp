# Drop-in for spoke hosts: /etc/ssh/sshd_config.d/ansible-flow-spoke.conf
# Only hub client identity should appear in mcp-spoke authorized_keys (with ForceCommand).

Match User mcp-spoke
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    # ForceCommand is also embedded on the authorized_keys line from spoke join.
    ForceCommand /usr/local/bin/ansible-flow-mcp spoke session
    AcceptEnv LANG LC_*
