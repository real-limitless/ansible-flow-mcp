# Drop-in for spoke hosts: /etc/ssh/sshd_config.d/ansible-flow-spoke.conf
#
# Two users:
#   mcp-spoke   — hub mesh only (ForceCommand → spoke MCP session / spoke_call)
#   mcp-ansible — ansible CLI over SSH (real shell; ansible_client key, no ForceCommand)
#
# Never put ansible_client on mcp-spoke with ForceCommand — ansible deadlocks waiting
# for /bin/sh while MCP waits for JSON-RPC, and hub MCP tool calls time out.

Match User mcp-spoke
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    ForceCommand /usr/local/bin/ansible-flow-mcp spoke session
    AcceptEnv LANG LC_*

Match User mcp-ansible
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    AcceptEnv LANG LC_*
