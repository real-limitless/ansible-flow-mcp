# Drop-in for hub: /etc/ssh/sshd_config.d/ansible-flow-hub-join.conf
# Join channel only — not for agent attachment.

Match User mcp-join
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    ForceCommand /usr/local/bin/ansible-flow-mcp hub accept-join
    AcceptEnv LANG LC_*
