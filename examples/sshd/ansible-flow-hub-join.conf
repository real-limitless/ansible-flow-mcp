# Drop-in for hub: /etc/ssh/sshd_config.d/ansible-flow-hub-join.conf
# Join channel only — not for agent attachment.

Match User mcp-join
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    # ForceCommand env so mcp-join does not fall back to empty XDG hub state.
    SetEnv ANSIBLE_FLOW_HUB_DIR=/var/lib/ansible-flow/hub
    ForceCommand /usr/bin/env ANSIBLE_FLOW_HUB_DIR=/var/lib/ansible-flow/hub /usr/local/bin/ansible-flow-mcp hub accept-join
    AcceptEnv LANG LC_*
